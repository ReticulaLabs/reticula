[package]
name = "reticula-app"
description = "Application layer for Reticula: wires a board, the UI and the Reticulum clients together"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
reticulum-sdk.workspace = true
reticula-hal = { path = "../reticula-hal" }
reticula-ui = { path = "../reticula-ui" }
reticula-lxmf = { path = "../reticula-lxmf" }
reticula-nomad = { path = "../reticula-nomad" }

tokio.workspace = true
getrandom.workspace = true
rand_core.workspace = true
log.workspace = true

[features]
# LoRa radio interface (e.g. SX1262) support. Enables the vendored SDK's
# `lora` feature. Off by default so the desktop simulator doesn't build it.
lora = ["reticulum-sdk/lora"]
# Resource-constrained device (e.g. the ESP32-S3 T-Deck). Enables the vendored
# SDK's `embedded` feature (short packet/destination/path retention). Off by
# default so the desktop simulator keeps the upstream behaviour.
embedded = ["reticulum-sdk/embedded"]

[lints]
workspace = true