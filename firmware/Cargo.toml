[package]
name = "reticula-firmware"
description = "Reticula firmware for the ESP32-S3 (LILYGO T-Deck)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[build-dependencies]
embuild = "0.31"

[dependencies]
reticula-app = { path = "../crates/reticula-app" }
reticula-tdeck = { path = "../crates/reticula-tdeck" }
reticulum-sdk.workspace = true
tokio.workspace = true

esp-idf-hal = "0.44"
esp-idf-svc = "0.51"
esp-idf-sys = { version = "0.35", features = ["binstart"] }
esp-idf-sys-macro = "0.3"

log.workspace = true

[lints]
workspace = true