[package]
name = "reticula-firmware"
description = "Reticula firmware for the ESP32-S3 (LILYGO T-Deck)"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kallisti5/reticula"
rust-version = "1.85"

# NOTE: This crate is excluded from the workspace root (see ../Cargo.toml) so
# host builds never try to compile the Xtensa-only code. Because it builds
# standalone, it cannot use `x.workspace = true` inheritance; dependencies are
# pinned here directly.

[build-dependencies]
embuild = { version = "0.31", features = ["espidf"] }

[dependencies]
reticula-app = { path = "../crates/reticula-app", features = ["lora"] }
reticula-tdeck = { path = "../crates/reticula-tdeck" }
# v2.3.0 gained upstream embedded support; disabling default features keeps
# the Linux-only tokio-serial/gpio-cdev deps out of the ESP-IDF build.
reticulum-sdk = { version = "2.3", default-features = false, features = ["alloc", "lora"] }
# No `signal`/`process`/`full`: signal-hook-registry does not build on ESP-IDF.
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }

esp-idf-hal = "0.45"
esp-idf-svc = { version = "0.51", features = ["alloc"] }
esp-idf-sys = { version = "0.36", features = ["binstart"] }
embedded-svc = "0.28"

log = "0.4"

[patch.crates-io]
# Vendored fork: embedded-friendly packet-cache retention (see
# third_party/README.md). The upstream 180 s retention grows without bound on
# a busy network and exhausts internal RAM on the T-Deck.
reticulum-sdk = { path = "../third_party/reticulum-sdk" }
# embuild pins bindgen 0.71.1, which produces broken bindings with modern
# clang (>= 21); the fork bumps it to 0.72.
embuild = { path = "../third_party/embuild" }

[profile.release]
panic = "abort"
