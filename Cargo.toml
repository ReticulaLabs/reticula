[workspace]
resolver = "2"

members = [
    "crates/reticula-hal",
    "crates/reticula-ui",
    "crates/reticula-lxmf",
    "crates/reticula-nomad",
    "crates/reticula-app",
    "crates/reticula-host",
    "sim",
]

# ESP32-only crates are kept out of the default build so that a plain
# `cargo check`/`cargo build` works on a host machine without the Xtensa
# toolchain. Build them explicitly for the ESP32-S3, see tools/build-esp32.sh.
exclude = [
    "crates/reticula-tdeck",
    "firmware",
    # Vendored fork of embuild with a bindgen bump; built only through the
    # firmware (via [patch.crates-io]).
    "third_party/embuild",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kallisti5/reticula"
rust-version = "1.85"

[workspace.dependencies]
# v2.3.0 gained upstream embedded support: the `serial`/`lora` interfaces are
# feature-gated, 64-bit counters use portable-atomic, and tokio uses a slimmed
# feature set. Default features (which include the Linux LoRa backend) are
# disabled here; `lora` is enabled on-demand via reticula-app's `lora` feature.
reticulum-sdk = { version = "2.3", default-features = false, features = ["alloc"] }
embedded-graphics = "0.8"

# Targeted tokio features: `signal`/`process` pull in signal-hook-registry,
# which does not build on the ESP-IDF target.
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
rand_core = "0.10"

serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3"
serde_bytes = "0.11"

log = "0.4"

# Common build tweaks for all workspace crates.
[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

# The vendored fork of embuild (bindgen bump for clang >= 21) is used by the
# whole workspace via the firmware's build. It is only wired in from
# firmware/Cargo.toml; no workspace-wide patch is needed here.